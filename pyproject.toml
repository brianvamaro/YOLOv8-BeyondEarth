[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "YOLOv8BeyondEarth"
version = "0.0.7"
license = {file = "LICENSE"}
authors = [
  { name="Nils C. Prieur", email="prieur.nils@gmail.com" },
]
description = "Tools and scripts to create YOLOv8 custom datasets, train the model and post-process the obtained results. Strong focus on the use of satellite imagery, and application on soild planetary bodies in our Solar system."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Review item G1-08. Two things were wrong here.
#
# `rastertools_BOULDERING` and `shptools_BOULDERING` were imported by `predict.py` and never
# declared, so a clean environment installed fine and then failed on the first import.
#
# The bounds are lower-only, which does not reproduce the *calling behaviour* the code depends on.
# The sahi pin matters most: this pipeline bypasses sahi's model wrapper and calls ultralytics
# directly, and the `conf=` contract it now relies on (X-01) plus `slice_image`'s return shape are
# both things a major sahi release could move. Upper bounds are stated where a break would be
# silent rather than loud. The exact environment behind any given result is captured per-run in the
# manifest (`presets.write_manifest` -> `code`), which is the reproducibility record; these bounds
# only keep a fresh install from being obviously wrong.
#
# Upper bounds added 2026-08-09 (review item, queue 8). Every geometry dependency was lower-only,
# so a fresh resolve was free to take the next major of anything. The concrete trigger: OpenCV
# **5.0.0.93** is now published and would be selected, and `cv2.resize(..., INTER_AREA)` is on the
# production mask-downscale path — a numerical change there is silent, not loud, and it would move
# every polygon in every catalog with nothing raising. The same argument covers scikit-image
# (`find_contours` is the default, deliberately bit-identical, contour extractor), Shapely
# (predicates), scipy (`label` / `binary_fill_holes` in the SAM cleanup) and lsnms (NMS is
# result-defining). Caps are at the next major — the next *minor* for the two 0.x packages, where
# minor is the breaking axis. Installed at the time of writing: opencv 4.13.0.92, numpy 2.2.6,
# geopandas 1.1.3, pandas 2.3.3, rasterio 1.4.4, scipy 1.15.3, Shapely 2.1.2, scikit-image 0.25.2,
# lsnms 0.4.5, torch 2.11.0+cu128.
dependencies = [
    "geopandas>=0.14.1,<2",
    "lsnms>=0.4.4,<0.5",
    "numpy>=1.24.4,<3",
    "opencv-python>=4.7.0.72,<5",
    "pandas>=2.2.1,<3",
    "rasterio>=1.3.9,<2",
    "sahi>=0.12.1,<0.13",
    "scipy>=1.10.0,<2",
    "Shapely>=2.0.3,<3",
    "scikit-image>=0.22.0,<0.26",
    "torch>=2.2.0,<3",
    "tqdm>=4.65.0",
    "ultralytics>=8.1.15,<9",
    # planetary raster/vector helpers, imported by predict.py and the Goal-2/3 analysis code.
    # Not on PyPI: installed from the maintainer's forks (see docs/environment.md).
    "rastertools_BOULDERING",
    "shptools_BOULDERING",
]

[project.optional-dependencies]
# Everything the tracked test suite and the analysis notebooks need beyond the runtime deps.
dev = [
    "pytest>=7.4",
    "matplotlib>=3.8",
    "jupytext>=1.16",
    "nbconvert>=7.0",
]

[project.urls]
"Homepage" = "https://github.com/astroNils/YOLOv8-BeyondEarth"
"Bug Tracker" = "https://github.com/astroNils/YOLOv8-BeyondEarth/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow / GPU / data-heavy (deselect with '-m \"not slow\"')",
]
